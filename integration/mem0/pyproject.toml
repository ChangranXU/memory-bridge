[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mem0-bridge"
version = "0.1.0"
description = "mem0 Platform integration for the shared memory bridge: hosted-memory backend/agent glue and its standardized-endpoint adapter."
requires-python = ">=3.10"
dependencies = ["shared-bridge", "httpx"]

[tool.uv.sources]
shared-bridge = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
