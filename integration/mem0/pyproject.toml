[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mem0-bridge"
version = "0.1.0"
description = "mem0 Platform integration for the shared memory bridge: hosted-memory backend/agent glue and its standardized-endpoint adapter."
requires-python = ">=3.10"
dependencies = ["shared-bridge", "httpx"]

[tool.uv.sources]
shared-bridge = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
# Load-bearing, not hygiene: a vendored mem0 tree under src/ (the server
# mode's API reference + docker build context; gitignored) would ship
# importable Python packages that a bare where=["src"] would build into the
# wheel. Only the bridge package is ours.
include = ["mem0_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
