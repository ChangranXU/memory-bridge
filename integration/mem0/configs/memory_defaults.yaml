# mem0 automatic-extraction overlay — pass AFTER the stock config:
#   --config swebench.yaml --config .../configs/memory_defaults.yaml \
#   --config agent.memory.enabled=true --config agent.memory.output_dir=<dir>
# PARTIAL overlay: only the agent.memory.* subtree. No model.model_class —
# the stock LitellmModel runs in both arms.
agent:
  memory:
    # The deployment mode selector: platform | server | library. Yaml-owned —
    # the driver reads THIS line (read_mem0_mode) and refuses
    # `--config agent.memory.mode=` extras. This line itself stays
    # comment-free: the reader's anchored match ends at the value.
    mode: platform
    enabled: false          # on/off switch; flip via --config agent.memory.enabled=true
    scope: run              # run | instance
    max_message_chars: 4000
    extract_every_n_steps: 10
    poll_budget: 120        # platform mode only: total add+poll budget (hosted extraction is async)
    extract_max_consecutive_errors: 3
    # Extraction policy/guidelines ("" -> the shared default text in
    # shared_bridge/prompts.py, sent as the add endpoint's advisory
    # custom_instructions; non-empty = this run's override, replacing the
    # default wholesale).
    extraction_guidelines: ""
    inject_recall: true
    max_memories: 10
    # Host-side recall render budgets over the memory lines (native kin:
    # recall.maxCharsPerMemory / recall.maxTotalRecallChars). The per-line
    # cap stays off (the native default); the 2000-char total preserves the
    # shipped arm bound.
    max_total_recall_chars: 2000
    max_chars_per_memory: 0
    infer: true             # engine-side extraction (false: verbatim storage)
    search_threshold: 0.0   # sent explicitly on every surface; never rely on an
                            # implicit default (platform: 0.0 disables the cutoff;
                            # OSS server/library: a minimal gate on the raw score)
    # The single relevance door: the shared host-side floor on the platform's
    # combined multi-signal score (0-1, present on search rows). 0.1 is the
    # documented v3 server default — a defensible first cut, a hypothesis to
    # measure rather than a truth. The OSS hybrid score is a different scale
    # (scores are never compared across modes): the driver passes
    # agent.memory.recall_min_score=null for server/library arms, keeping the
    # floor platform-only until a calibration pair picks a per-mode value.
    # While set, the arm searches with a wider top_k so the floor has a pool
    # to filter.
    recall_min_score: 0.1
    # Recall-query rewriter via the QUERY proxy lane (the driver exports
    # MEMORY_QUERY_* per instance; the lane shares the flat BASE_URL).
    rewrite_every_n_steps: 10
    poll_interval: 1.0      # platform mode only: async add event polling cadence
